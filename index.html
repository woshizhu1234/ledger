<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能记账本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f7fa; color: #333; -webkit-font-smoothing: antialiased; }
        
        /* 头部 */
        header { background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%); color: white; padding: 20px 15px 30px; text-align: center; position: relative; box-shadow: 0 2px 10px rgba(74,144,226,0.3); }
        header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        header p { font-size: 12px; opacity: 0.9; }
        
        /* 汇总卡片 */
        .summary-card { background: white; margin: -20px 15px 15px; padding: 20px 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .total-balance { font-size: 32px; font-weight: bold; color: #2c3e50; text-align: center; flex: 1; }
        .income-expense { display: flex; gap: 10px; margin-top: 15px; }
        .ie-item { flex: 1; text-align: center; padding: 8px; background: #f8f9fa; border-radius: 8px; }
        .ie-item .lab { font-size: 11px; color: #666; margin-bottom: 2px; }
        .ie-item .val { font-size: 14px; font-weight: 600; }
        .ie-income .val { color: #27ae60; }
        .ie-expense .val { color: #e74c3c; }
        
        /* 预算进度条 */
        .card { background: white; margin: 0 15px 15px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #444; }
        .progress-bar { height: 6px; background: #ecf0f1; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4a90e2, #50c878); transition: width 0.3s ease; border-radius: 3px; }
        .budget-text { text-align: right; font-size: 11px; color: #999; }
        
        /* 筛选标签 */
        .filter-tabs { display: flex; background: white; margin: 0 15px 15px; padding: 4px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: #666; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab.active { background: #4a90e2; color: white; font-weight: 600; box-shadow: 0 2px 6px rgba(74,144,226,0.4); }
        
        /* 列表 */
        .record-list { margin: 0 15px; }
        .record-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease; position: relative; overflow: hidden; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .rec-left { flex: 1; }
        .rec-desc { font-size: 15px; font-weight: 500; margin-bottom: 4px; word-break: break-all; }
        .rec-meta { font-size: 11px; color: #95a5a6; display: flex; align-items: center; gap: 8px; }
        .rec-cat { display: inline-flex; align-items: center; gap: 3px; background: #f0f4f8; padding: 2px 6px; border-radius: 4px; }
        
        .rec-right { text-align: right; margin-left: 10px; }
        .rec-amount { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
        .amount-exp { color: #e74c3c; }
        .amount-inc { color: #27ae60; }
        .amount-sav { color: #4a90e2; }
        
        /* 操作按钮 */
        .rec-actions { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; gap: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
        .record-item.show-actions .rec-actions { opacity: 1; pointer-events: all; }
        .btn-del { width: 44px; height: 44px; border-radius: 50%; border: none; background: #e74c3c; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(231,76,60,0.4); transition: transform 0.1s; }
        .btn-del:active { transform: scale(0.92); }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 40px 20px; color: #bdc3c7; }
        .empty-state .icon { font-size: 48px; margin-bottom: 10px; }
        
        /* FAB */
        .fab { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: #4a90e2; color: white; border: none; font-size: 28px; box-shadow: 0 4px 12px rgba(74,144,226,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: transform 0.2s; }
        .fab:active { transform: scale(0.94); }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; animation: fadeIn 0.2s; }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { background: white; border-radius: 16px; width: 100%; max-width: 360px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; animation: scaleIn 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* 表单 */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s; font-family: inherit; }
        .form-input:focus { border-color: #4a90e2; box-shadow: 0 0 0 2px rgba(74,144,226,0.1); }
        .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
        .cat-item { padding: 8px 4px; border: 1px solid #eee; border-radius: 6px; text-align: center; font-size: 12px; cursor: pointer; transition: all 0.2s; background: white; }
        .cat-item:active { transform: scale(0.98); }
        .cat-item.selected { border-color: #4a90e2; background: #eaf2ff; color: #4a90e2; font-weight: 600; }
        .cat-emo { font-size: 18px; display: block; margin-bottom: 2px; }
        
        .modal-footer { padding: 12px 20px 20px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-secondary { background: #f0f4f8; color: #666; }
        
        .btn:active { opacity: 0.85; }
        
        /* Toast */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 2000; display: none; animation: toastIn 0.3s; }
        .toast.show { display: block; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body>

<header>
    <h1>智能记账本</h1>
    Smart Ledger
</header>

<div class="summary-card">
    <div class="total-balance" id="totalBalance">¥0.00</div>
    <div class="income-expense">
        <div class="ie-item ie-income">
            <div class="lab">收入</div>
            <div class="val" id="totalIncome">+¥0</div>
        </div>
        <div class="ie-item ie-expense">
            <div class="lab">支出</div>
            <div class="val" id="totalExpense">-¥0</div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span>💰 月度预算</span>
        <span id="budgetText">未设置</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="budgetBar" style="width: 0%"></div>
    </div>
</div>

<div class="filter-tabs">
    <div class="tab active" data-filter="all">全部</div>
    <div class="tab" data-filter="today">今天</div>
    <div class="tab" data-filter="week">本周</div>
    <div class="tab" data-filter="month">本月</div>
</div>

<div class="record-list" id="recordList">
    <!-- 列表内容 -->
</div>

<button class="fab" id="addBtn">+</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 记账 Modal -->
<div class="modal-overlay" id="entryModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">记一笔</div>
            <button class="modal-close" onclick="closeEntryModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="typeSelect">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                    <option value="save">攒钱</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">分类</label>
                <div class="cat-grid" id="catGrid">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">金额</label>
                <input type="number" class="form-input" id="amtInput" placeholder="0.00" step="0.01">
            </div>
            
            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" id="noteInput" placeholder="记个事...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeEntryModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmEntry()">确定</button>
        </div>
    </div>
</div>

<!-- 编辑 Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">编辑记录</div>
            <button class="modal-close" onclick="closeEditModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="editType">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                    <option value="save">攒钱</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">分类</label>
                <div class="cat-grid" id="editCatGrid">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">金额</label>
                <input type="number" class="form-input" id="editAmt" placeholder="0.00" step="0.01">
            </div>
            
            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" id="editNote" placeholder="记个事...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
            <button class="btn btn-primary" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<script>
// ===== 配置 =====
var CATS = {
    expense: [
        {n: '餐饮', o: '🍔'}, {n: '交通', o: '🚗'}, {n: '购物', o: '🛍️'}, 
        {n: '娱乐', o: '🎮'}, {n: '住房', o: '🏠'}, {n: '医疗', o: '💊'}, 
        {n: '学习', o: '📚'}, {n: '人情', o: '🎁'}, {n: '数码', o: '💻'}, 
        {n: '其他', o: '📝'}
    ],
    income: [
        {n: '工资', o: '💼'}, {n: '奖金', o: '🧧'}, {n: '兼职', o: '🛠️'}, 
        {n: '理财', o: '📈'}, {n: '红包', o: '🧧'}, {n: '其他', o: '💵'}
    ],
    save: [
        {n: '应急金', o: '🛡️'}, {n: '旅行', o: '✈️'}, {n: '学习', o: '📖'}, 
        {n: '购物', o: '🛍️'}, {n: '投资', o: '📊'}, {n: '其他', o: '🐷'}
    ]
};

// ===== 数据存储 =====
var records = JSON.parse(localStorage.getItem('smart_records') || '[]');
var saveGoal = JSON.parse(localStorage.getItem('save_goal') || '{"target": 0, "saved": 0}');
var currentFilter = 'all';
var editingId = null;

// ===== 工具函数 =====
function save() {
    localStorage.setItem('smart_records', JSON.stringify(records));
    localStorage.setItem('save_goal', JSON.stringify(saveGoal));
}

function formatDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getTodayStr() {
    return formatDate(new Date());
}

function getWeekRange() {
    var now = new Date();
    var day = now.getDay();
    var diff = now.getDate() - day + (day === 0 ? -6 : 1);
    var mon = new Date(now.setDate(diff));
    return formatDate(mon);
}

// ===== 渲染 =====
function render() {
    var list = document.getElementById('recordList');
    list.innerHTML = '';
    
    // 筛选
    var filtered = records.filter(function(r) {
        if (currentFilter === 'today') return r.date === getTodayStr();
        if (currentFilter === 'week') return r.date >= getWeekRange();
        if (currentFilter === 'month') return r.date.slice(0, 7) === formatDate(new Date()).slice(0, 7);
        return true;
    });
    
    if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>暂无记录</div></div>';
        return;
    }
    
    filtered.forEach(function(r) {
        var div = document.createElement('div');
        div.className = 'record-item';
        div.dataset.id = r.id;
        
        var sign = r.type === 'expense' ? '-' : '+';
        var cls = 'amount-' + (r.type === 'expense' ? 'exp' : r.type === 'income' ? 'inc' : 'sav');
        
        div.innerHTML = '<div class="rec-left">' +
            '<div class="rec-desc">' + escapeHtml(r.desc) + '</div>' +
            '<div class="rec-meta">' +
                '<span>' + r.time + '</span>' +
                '<span class="rec-cat">' + r.catEmo + ' ' + escapeHtml(r.cat) + '</span>' +
            '</div></div>' +
            '<div class="rec-right">' +
                '<div class="rec-amount ' + cls + '">' + sign + '¥' + r.amount.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="rec-actions">' +
                '<button class="btn-del" onclick="deleteRecord(\'' + r.id + '\')">🗑️</button>' +
            '</div>';
        
        list.appendChild(div);
    });
    
    updateSummary();
    updateBudget();
}

function escapeHtml(text) {
    var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}

// ===== 统计 =====
function updateSummary() {
    var inc = records.filter(function(r) { return r.type === 'income'; }).reduce(function(s, r) { return s + r.amount; }, 0);
    var exp = records.filter(function(r) { return r.type === 'expense'; }).reduce(function(s, r) { return s + r.amount; }, 0);
    var sav = records.filter(function(r) { return r.type === 'save'; }).reduce(function(s, r) { return s + r.amount; }, 0);
    
    document.getElementById('totalIncome').innerText = '+¥' + inc.toFixed(2);
    document.getElementById('totalExpense').innerText = '-¥' + exp.toFixed(2);
    document.getElementById('totalBalance').innerText = '¥' + (inc + sav - exp).toFixed(2);
}

function updateBudget() {
    var now = new Date();
    var month = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    var monthExp = records.filter(function(r) { return r.type === 'expense' && r.date.startsWith(month); }).reduce(function(s, r) { return s + r.amount; }, 0);
    
    var budget = saveGoal.target;
    if (budget > 0) {
        var perc = Math.min(100, (monthExp / budget) * 100);
        document.getElementById('budgetBar').style.width = perc + '%';
        document.getElementById('budgetText').innerText = '¥' + monthExp.toFixed(2) + ' / ¥' + budget.toFixed(2);
        
        if (perc > 90) document.getElementById('budgetBar').style.background = '#e74c3c';
        else if (perc > 70) document.getElementById('budgetBar').style.background = '#f39c12';
        else document.getElementById('budgetBar').style.background = 'linear-gradient(90deg, #4a90e2, #50c878)';
    } else {
        document.getElementById('budgetBar').style.width = '0%';
        document.getElementById('budgetText').innerText = '未设置';
    }
}

// ===== 交互 =====
document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        render();
    });
});

// 长按显示删除
var pressTimer;
document.getElementById('recordList').addEventListener('touchstart', function(e) {
    var target = e.target.closest('.record-item');
    if (!target) return;
    pressTimer = setTimeout(function() {
        document.querySelectorAll('.record-item').forEach(function(item) {
            item.classList.remove('show-actions');
        });
        target.classList.add('show-actions');
    }, 500);
}, {passive: true});

document.getElementById('recordList').addEventListener('touchend', function(e) {
    clearTimeout(pressTimer);
});

document.getElementById('recordList').addEventListener('touchmove', function(e) {
    clearTimeout(pressTimer);
});

// ===== 记账功能 =====
var currentType = 'expense';
var currentCat = CATS.expense[0].n;

function openEntryModal(type) {
    currentType = type || 'expense';
    var modal = document.getElementById('entryModal');
    var title = document.getElementById('modalTitle');
    
    if (currentType === 'expense') title.innerText = '记一笔支出';
    else if (currentType === 'income') title.innerText = '记一笔收入';
    else title.innerText = '攒一笔钱';
    
    renderCatGrid('catGrid', currentType, function(cat) {
        currentCat = cat;
    });
    
    document.getElementById('typeSelect').value = currentType;
    document.getElementById('amtInput').value = '';
    document.getElementById('noteInput').value = '';
    modal.classList.add('show');
    document.getElementById('amtInput').focus();
}

document.getElementById('addBtn').addEventListener('click', function() {
    openEntryModal('expense');
});

document.getElementById('typeSelect').addEventListener('change', function() {
    currentType = this.value;
    var title = document.getElementById('modalTitle');
    if (currentType === 'expense') title.innerText = '记一笔支出';
    else if (currentType === 'income') title.innerText = '记一笔收入';
    else title.innerText = '攒一笔钱';
    renderCatGrid('catGrid', currentType, function(cat) {
        currentCat = cat;
    });
});

function renderCatGrid(containerId, type, callback) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    CATS[type].forEach(function(cat) {
        var div = document.createElement('div');
        div.className = 'cat-item';
        div.innerHTML = '<span class="cat-emo">' + cat.o + '</span>' + cat.n;
        div.addEventListener('click', function() {
            document.querySelectorAll('#' + containerId + ' .cat-item').forEach(function(el) {
                el.classList.remove('selected');
            });
            this.classList.add('selected');
            callback(cat.n);
        });
        container.appendChild(div);
    });
    // 默认选中第一个
    if (container.firstChild) container.firstChild.classList.add('selected');
}

function confirmEntry() {
    var amt = parseFloat(document.getElementById('amtInput').value);
    var note = document.getElementById('noteInput').value.trim();
    if (!amt || amt <= 0) { showToast('⚠️ 请输入有效金额'); return; }
    if (!currentCat) { showToast('⚠️ 请选择分类'); return; }
    
    var now = new Date();
    records.unshift({
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        type: currentType,
        amount: amt,
        cat: currentCat,
        catEmo: CATS[currentType].find(function(c) { return c.n === currentCat; }).o,
        desc: note || (currentType === 'expense' ? '支出' : currentType === 'income' ? '收入' : '攒钱'),
        time: now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}),
        date: formatDate(now)
    });
    
    save();
    closeEntryModal();
    render();
    showToast('✅ 记录成功');
}

function closeEntryModal() {
    document.getElementById('entryModal').classList.remove('show');
}

// ===== 删除功能 =====
function deleteRecord(id) {
    if (!confirm('确定要删除这条记录吗？')) return;
    records = records.filter(function(r) { return r.id !== id; });
    save();
    render();
    showToast('🗑️ 已删除');
}

// ===== 编辑功能 =====
function openEditModal(id) {
    editingId = id;
    var r = records.find(function(x) { return x.id === id; });
    if (!r) return;
    
    document.getElementById('editType').value = r.type;
    document.getElementById('editAmt').value = r.amount;
    document.getElementById('editNote').value = r.desc;
    
    renderCatGrid('editCatGrid', r.type, function() {});
    
    // 选中当前分类
    setTimeout(function() {
        document.querySelectorAll('#editCatGrid .cat-item').forEach(function(el) {
            el.classList.remove('selected');
            if (el.innerText.includes(r.cat)) el.classList.add('selected');
        });
    }, 10);
    
    document.getElementById('editModal').classList.add('show');
}

function saveEdit() {
    var r = records.find(function(x) { return x.id === editingId; });
    if (!r) return;
    
    var amt = parseFloat(document.getElementById('editAmt').value);
    var note = document.getElementById('editNote').value.trim();
    var type = document.getElementById('editType').value;
    var catItems = document.querySelectorAll('#editCatGrid .cat-item');
    var cat = '其他';
    for (var i = 0; i < catItems.length; i++) {
        if (catItems[i].classList.contains('selected')) {
            cat = catItems[i].innerText.replace(/^[^\s]+\s*/, '');
            break;
        }
    }
    
    if (!amt || amt <= 0) { showToast('⚠️ 请输入有效金额'); return; }
    
    // 更新数据
    r.type = type;
    r.amount = amt;
    r.cat = cat;
    r.desc = note || (type === 'expense' ? '支出' : type === 'income' ? '收入' : '攒钱');
    r.catEmo = CATS[type].find(function(c) { return c.n === cat; }).o;
    
    save();
    closeEditModal();
    render();
    showToast('✅ 已更新');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
    editingId = null;
}

// ===== 目标功能 =====
function updateSaveGoalUI() {
    updateBudget();
}

// ===== Toast =====
function showToast(msg) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(function() {
        t.classList.remove('show');
    }, 2000);
}

// ===== 初始化 =====
render();

// 暴露函数给全局
window.openEntryModal = openEntryModal;
window.closeEntryModal = closeEntryModal;
window.confirmEntry = confirmEntry;
window.openEditModal = openEditModal;
window.closeEditModal = closeEditModal;
window.saveEdit = saveEdit;
window.deleteRecord = deleteRecord;
</script>
