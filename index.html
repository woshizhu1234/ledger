<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>智能记账本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333;max-width:600px;margin:0 auto;padding-bottom:80px}
.header{background:linear-gradient(135deg,#4a90e2,#357abd);color:#fff;padding:20px 15px;text-align:center}
.header h1{font-size:20px;margin-bottom:4px}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;margin:12px;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.total{font-size:32px;font-weight:700;text-align:center;margin-bottom:8px}
.stats{display:flex;justify-content:space-around;font-size:14px}
.stats .income{color:#52c41a}
.stats .expense{color:#ff4d4f}
.budget-header{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.progress-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#52c41a;transition:width .3s;border-radius:4px}
.filters{display:flex;gap:8px;margin:0 12px 12px}
.filter-btn{flex:1;padding:8px;border:none;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.filter-btn.active{background:#4a90e2;color:#fff}
.record-list{margin:0 12px}
.record-item{background:#fff;padding:14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.record-left{flex:1}
.record-desc{font-size:15px;font-weight:500;margin-bottom:4px}
.record-meta{font-size:12px;color:#999}
.record-amount{font-size:16px;font-weight:700;text-align:right}
.amount-income{color:#52c41a}
.amount-expense{color:#ff4d4f}
.amount-save{color:#1890ff}
.delete-btn{background:#ff4d4f;color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;margin-left:10px;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px;color:#999}
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#4a90e2;color:#fff;font-size:28px;border:none;box-shadow:0 4px 12px rgba(74,144,226,.4);cursor:pointer;z-index:100}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:360px;overflow:hidden}
.modal-header{background:#4a90e2;color:#fff;padding:16px;text-align:center;font-size:18px;font-weight:500;position:relative}
.modal-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.modal-body{padding:20px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#555}
.form-input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.form-input:focus{border-color:#4a90e2}
.type-select{display:flex;gap:8px;margin-bottom:16px}
.type-btn{flex:1;padding:10px;border:2px solid #e8e8e8;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;text-align:center}
.type-btn.active{border-color:#4a90e2;background:#e6f2ff;color:#4a90e2;font-weight:500}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.cat-item{padding:8px 4px;border-radius:8px;background:#f5f5f5;border:2px solid transparent;font-size:12px;cursor:pointer;text-align:center}
.cat-item.selected{border-color:#4a90e2;background:#e6f2ff;color:#4a90e2}
.cat-emoji{font-size:20px;display:block;margin-bottom:2px}
.modal-footer{display:flex;gap:10px;padding:0 20px 20px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:500}
.btn-cancel{background:#f0f2f5;color:#666}
.btn-save{background:#4a90e2;color:#fff}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;z-index:2000;display:none}
.toast.show{display:block}
</style>
</head>
<body>

<div class="header">
  <h1>智能记账本</h1>
  <p id="dateDisplay"></p>
</div>

<div class="card">
  <div class="total">¥<span id="totalBalance">0.00</span></div>
  <div class="stats">
    <span>收入 <span class="income" id="totalIncome">+¥0</span></span>
    <span>支出 <span class="expense" id="totalExpense">-¥0</span></span>
  </div>
</div>

<div class="card">
  <div class="budget-header">
    <span>🎯 月度预算</span>
    <span id="budgetLabel">未设置</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="budgetBar" style="width:0%"></div>
  </div>
  <div style="text-align:right;font-size:12px;color:#999;margin-top:4px" id="budgetText">¥0 / ¥0</div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
  <button class="filter-btn" onclick="setFilter('today',this)">今天</button>
  <button class="filter-btn" onclick="setFilter('week',this)">本周</button>
  <button class="filter-btn" onclick="setFilter('month',this)">本月</button>
</div>

<div class="record-list" id="recordList">
  <div class="empty">暂无记录，点击下方 + 开始记账</div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- 记账弹窗 -->
<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <div class="modal-header">
      记一笔
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="type-select">
        <button class="type-btn active" data-type="expense" onclick="setType('expense',this)">💸 支出</button>
        <button class="type-btn" data-type="income" onclick="setType('income',this)">💰 收入</button>
        <button class="type-btn" data-type="save" onclick="setType('save',this)">🏦 攒钱</button>
      </div>
      <div class="form-group">
        <label class="form-label">金额</label>
        <input type="number" class="form-input" id="entryAmt" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <div class="cat-grid" id="catGrid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">备注</label>
        <input type="text" class="form-input" id="entryNote" placeholder="选填">
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn btn-save" onclick="saveEntry()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据 =====
var records = JSON.parse(localStorage.getItem('my_ledger') || '[]');
var currentFilter = 'all';
var currentType = 'expense';
var currentCat = '';

// ===== 分类 =====
var CATS = {
  expense: [{n:'餐饮',o:'🍔'},{n:'交通',o:'🚗'},{n:'购物',o:'🛍️'},{n:'日用',o:'🧴'},{n:'娱乐',o:'🎮'},{n:'医疗',o:'💊'},{n:'学习',o:'📚'},{n:'人情',o:'🎁'},{n:'住房',o:'🏠'},{n:'其他',o:'❓'}],
  income: [{n:'工资',o:'💼'},{n:'奖金',o:'🧧'},{n:'兼职',o:'🛠️'},{n:'理财',o:'📈'},{n:'红包',o:'🧧'},{n:'其他',o:'💵'}],
  save: [{n:'日常储蓄',o:'🏦'},{n:'应急资金',o:'🛡️'},{n:'大额目标',o:'🏆'},{n:'其他',o:'💰'}]
};

// ===== 工具 =====
function fmtDate(d) {
  d = d || new Date();
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr() { return fmtDate(new Date()); }
function weekStart() {
  var d=new Date(); var day=d.getDay()||7; d.setDate(d.getDate()-day+1); return fmtDate(d);
}

// ===== 渲染分类 =====
function renderCats(type) {
  var grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATS[type].forEach(function(c) {
    var el = document.createElement('div');
    el.className = 'cat-item';
    el.innerHTML = '<span class="cat-emoji">'+c.o+'</span>'+c.n;
    el.onclick = function() {
      grid.querySelectorAll('.cat-item').forEach(function(i){i.classList.remove('selected');});
      el.classList.add('selected');
      currentCat = c.n;
    };
    grid.appendChild(el);
  });
  if(grid.firstChild) grid.firstChild.click();
}

// ===== Toast =====
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ===== 弹窗 =====
function openModal() {
  document.getElementById('entryModal').classList.add('show');
  renderCats(currentType);
  document.getElementById('entryAmt').value = '';
  document.getElementById('entryNote').value = '';
  setTimeout(function(){document.getElementById('entryAmt').focus();},100);
}
function closeModal() {
  document.getElementById('entryModal').classList.remove('show');
}
function setType(type, btn) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderCats(type);
}

// ===== 保存 =====
function saveEntry() {
  var amt = parseFloat(document.getElementById('entryAmt').value);
  var note = document.getElementById('entryNote').value.trim();
  if(!amt || amt<=0) { toast('⚠️ 请输入有效金额'); return; }
  if(!currentCat) { toast('⚠️ 请选择分类'); return; }
  var now = new Date();
  records.unshift({
    id: Date.now()+'_'+Math.random().toString(36).substr(2,6),
    type: currentType,
    amount: amt,
    cat: currentCat,
    catEmo: CATS[currentType].find(function(c){return c.n===currentCat;}).o,
    desc: note || (currentType==='expense'?'支出':currentType==='income'?'收入':'攒钱'),
    time: now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
    date: fmtDate(now)
  });
  localStorage.setItem('my_ledger', JSON.stringify(records));
  closeModal();
  render();
  toast('✅ 记录成功');
}

// ===== 删除 =====
function delRecord(id) {
  if(!confirm('确定删除这条记录吗？')) return;
  records = records.filter(function(r){return r.id!==id;});
  localStorage.setItem('my_ledger', JSON.stringify(records));
  render();
  toast('🗑️ 已删除');
}

// ===== 筛选 =====
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}

// ===== 渲染 =====
function render() {
  var list = document.getElementById('recordList');
  var filtered = records;
  if(currentFilter==='today') filtered = filtered.filter(function(r){return r.date===todayStr();});
  else if(currentFilter==='week') filtered = filtered.filter(function(r){return r.date>=weekStart();});
  else if(currentFilter==='month') {
    var prefix = fmtDate(new Date()).slice(0,7);
    filtered = filtered.filter(function(r){return r.date.startsWith(prefix);});
  }
  
  if(filtered.length===0) {
    list.innerHTML = '<div class="empty">暂无记录</div>';
  } else {
    var html = '';
    filtered.forEach(function(r) {
      var cls = r.type==='income'?'amount-income':r.type==='expense'?'amount-expense':'amount-save';
      var sign = r.type==='expense'?'-':'+';
      html += '<div class="record-item">'+
        '<div class="record-left">'+
          '<div class="record-desc">'+r.catEmo+' '+r.desc+'</div>'+
          '<div class="record-meta">'+r.time+' · '+r.cat+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center">'+
          '<div class="record-amount '+cls+'">'+sign+'¥'+r.amount.toFixed(2)+'</div>'+
          '<button class="delete-btn" onclick="delRecord(\''+r.id+'\')">✕</button>'+
        '</div>'+
      '</div>';
    });
    list.innerHTML = html;
  }
  
  updateStats();
}

// ===== 统计 =====
function updateStats() {
  var inc = records.filter(function(r){return r.type==='income';}).reduce(function(s,r){return s+r.amount;},0);
  var exp = records.filter(function(r){return r.type==='expense';}).reduce(function(s,r){return s+r.amount;},0);
  document.getElementById('totalIncome').textContent = '+¥'+inc.toFixed(2);
  document.getElementById('totalExpense').textContent = '-¥'+exp.toFixed(2);
  document.getElementById('totalBalance').textContent = (inc-exp).toFixed(2);
  
  var prefix = fmtDate(new Date()).slice(0,7);
  var monthExp = records.filter(function(r){return r.type==='expense'&&r.date.startsWith(prefix);}).reduce(function(s,r){return s+r.amount;},0);
  var budget = 5000;
  var pct = Math.min(100, (monthExp/budget)*100);
  document.getElementById('budgetBar').style.width = pct+'%';
  document.getElementById('budgetText').textContent = '¥'+monthExp.toFixed(2)+' / ¥'+budget.toFixed(2);
  document.getElementById('budgetLabel').textContent = '已用 '+pct.toFixed(0)+'%';
}

// ===== 日期 =====
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

// ===== 初始化 =====
render();
</script>
</body>
</html>
