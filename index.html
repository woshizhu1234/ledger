<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能记账本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f5f7fa;color:#333;max-width:600px;margin:0 auto;padding-bottom:80px}
.header{text-align:center;padding:20px 15px 25px;background:linear-gradient(135deg,#4a90e2,#6aa3e8);color:#fff;border-radius:0 0 20px 20px;margin-bottom:15px}
.date-display{font-size:13px;opacity:.9}
.total-amount{font-size:36px;font-weight:700;margin:8px 0}
.header-row{display:flex;justify-content:center;gap:15px}
.header-pill{background:rgba(255,255,255,.22);padding:4px 14px;border-radius:16px;font-size:13px}
.budget-bar{background:#fff;margin:0 15px 15px;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.budget-label{font-size:14px;font-weight:600;margin-bottom:8px}
.progress-bg{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#4a90e2;width:0%;transition:width .3s}
.budget-text{text-align:right;font-size:12px;color:#999;margin-top:6px}
.nav-tabs{display:flex;background:#fff;margin:0 15px 15px;border-radius:12px;padding:4px}
.tab-btn{flex:1;text-align:center;padding:8px 0;font-size:13px;border-radius:10px;cursor:pointer;color:#666;font-weight:500}
.tab-btn.active{background:#4a90e2;color:#fff}
.content-area{margin:0 15px}
.record-item{display:flex;align-items:center;background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.rec-left{flex:1;min-width:0}
.rec-desc{font-size:15px;font-weight:600;margin-bottom:2px}
.rec-cat{font-size:12px;color:#999}
.rec-amount{font-size:16px;font-weight:700;margin-left:10px;white-space:nowrap}
.rec-amount.income{color:#50c878}
.rec-amount.expense{color:#ff4d4f}
.rec-del{background:rgba(0,0,0,.05);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;cursor:pointer;margin-left:8px}
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#4a90e2;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(74,144,226,.4);cursor:pointer;z-index:100}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal-mask.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:360px;border-radius:20px;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:16px;font-weight:600;border-bottom:1px solid #f0f0f0}
.close-btn{cursor:pointer;font-size:20px;color:#999}
.form-group{padding:20px}
.input-group{display:flex;align-items:center;background:#f8f9fa;border-radius:10px;padding:0 12px;margin-bottom:12px;border:1px solid #eee}
.input-icon{font-size:16px;margin-right:8px;opacity:.6}
.form-control{width:100%;border:none;outline:none;padding:12px 0;font-size:15px;background:transparent}
.radio-group{display:flex;gap:20px;margin-top:10px}
.radio-item{display:flex;align-items:center;cursor:pointer}
.radio-item input{margin-right:6px}
.btn-primary{width:100%;background:#4a90e2;color:#fff;border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;font-weight:600;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <div class="date-display" id="dateDisplay"></div>
  <div class="total-amount" id="totalAmount">¥0.00</div>
  <div class="header-row">
    <div class="header-pill" id="incomeDisplay">收入 +¥0</div>
    <div class="header-pill" id="expenseDisplay">支出 -¥0</div>
  </div>
</div>
<div class="budget-bar">
  <div class="budget-label">🎯 月度预算</div>
  <div class="progress-bg"><div class="progress-fill" id="budgetProgress" style="width:0%"></div></div>
  <div class="budget-text" id="budgetText">¥0 / ¥5,000</div>
</div>
<div class="nav-tabs">
  <div class="tab-btn active" onclick="switchTab('all',this)">全部</div>
  <div class="tab-btn" onclick="switchTab('today',this)">今天</div>
  <div class="tab-btn" onclick="switchTab('week',this)">本周</div>
  <div class="tab-btn" onclick="switchTab('month',this)">本月</div>
</div>
<div class="content-area" id="recordList"></div>
<div class="fab" onclick="openModal()">+</div>

<div class="modal-mask" id="entryModal">
  <div class="modal-box">
    <div class="modal-header"><span>✏️ 记一笔</span><span class="close-btn" onclick="closeModal()">✕</span></div>
    <div class="form-group">
      <div class="input-group"><span class="input-icon">💰</span><input type="number" class="form-control" id="entryAmount" placeholder="金额（如 25.5）"></div>
      <div class="input-group"><span class="input-icon">📝</span><input type="text" class="form-control" id="entryNote" placeholder="备注（如 午饭）"></div>
      <div class="input-group"><span class="input-icon">🏷️</span>
        <select class="form-control" id="entryCategory">
          <option value="餐饮">餐饮</option><option value="交通">交通</option><option value="购物">购物</option>
          <option value="娱乐">娱乐</option><option value="居住">居住</option><option value="医疗">医疗</option>
          <option value="教育">教育</option><option value="通讯">通讯</option><option value="其他">其他</option>
        </select>
      </div>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="etype" value="expense" checked> 支出</label>
        <label class="radio-item"><input type="radio" name="etype" value="income"> 收入</label>
      </div>
      <button class="btn-primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem('ledger_records') || '[]');
let currentTab = 'all';

document.addEventListener('DOMContentLoaded', () => {
  updateDate();
  updateSummary();
  renderList();
});

function updateDate() {
  const d = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('dateDisplay').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
}

function updateSummary() {
  const income = records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const expense = records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  document.getElementById('incomeDisplay').textContent = `收入 +¥${income.toFixed(2)}`;
  document.getElementById('expenseDisplay').textContent = `支出 -¥${expense.toFixed(2)}`;
  document.getElementById('totalAmount').textContent = `¥${(income-expense).toFixed(2)}`;
  const used = Math.min(expense, 5000);
  document.getElementById('budgetProgress').style.width = `${(used/5000)*100}%`;
  document.getElementById('budgetText').textContent = `¥${used.toFixed(0)} / ¥5,000`;
}

function renderList() {
  const list = document.getElementById('recordList');
  let filtered = records;
  const now = new Date();
  if(currentTab==='today') {
    filtered = records.filter(r => new Date(r.time).toDateString()===now.toDateString());
  } else if(currentTab==='week') {
    const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay());
    filtered = records.filter(r => new Date(r.time)>=weekStart);
  } else if(currentTab==='month') {
    filtered = records.filter(r => new Date(r.time).getMonth()===now.getMonth());
  }
  if(filtered.length===0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#999">暂无记录</div>';
    return;
  }
  let html = '';
  filtered.forEach(r => {
    const d = new Date(r.time);
