<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>智能记账本</title>
<style>
:root {
  --primary: #4a90e2;
  --primary-dark: #357abd;
  --success: #50c878;
  --danger: #ff4d4f;
  --warning: #faad14;
  --dark: #2c3e50;
  --gray: #95a5a6;
  --border: #bdc3c7;
  --bg: #f5f7fa;
  --save-color: #f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:80px;max-width:600px;margin:0 auto}
.header{text-align:center;padding:20px 15px 25px;background:linear-gradient(135deg,#4a90e2,#6aa3e8);color:#fff;border-radius:0 0 20px 20px;margin-bottom:15px;box-shadow:0 4px 12px rgba(74,144,226,.3);position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.date-display{font-size:13px;opacity:.9;position:relative;z-index:1}
.total-amount{font-size:36px;font-weight:700;margin:8px 0;position:relative;z-index:1}
.header-row{display:flex;justify-content:center;gap:15px;position:relative;z-index:1}
.header-pill{background:rgba(255,255,255,.22);padding:4px 14px;border-radius:16px;font-size:13px;font-weight:600}
.budget-wrap{margin:0 15px 10px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.budget-top{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:5px}
.budget-track{height:6px;background:#f0f0f5;border-radius:3px;overflow:hidden}
.budget-fill{height:100%;border-radius:3px;transition:width .5s;background:var(--success)}
.budget-fill.warn{background:var(--warning)}
.budget-fill.danger{background:var(--danger);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.save-wrap{margin:0 15px 15px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(245,158,11,.15);border:1.5px solid #fde68a}
.save-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.save-title{font-size:14px;font-weight:700;color:#92400e;display:flex;align-items:center;gap:6px}
.save-target-text{font-size:12px;color:#b45309}
.save-progress-track{height:10px;background:#fde68a;border-radius:5px;overflow:hidden;margin-bottom:6px}
.save-progress-fill{height:100%;border-radius:5px;transition:width .8s ease;background:linear-gradient(90deg,#f59e0b,#fbbf24);position:relative}
.save-progress-fill.full{background:linear-gradient(90deg,#10b981,#34d399);animation:glow 1.5s ease infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.save-details{display:flex;justify-content:space-between;font-size:12px;color:#92400e}
.save-details .saved{font-weight:700;font-size:14px;color:#b45309}
.save-details .remaining{color:#b45309}
.save-details .remaining.zero{color:var(--success);font-weight:700}
.quick-input{background:#fff;padding:18px 15px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin:0 15px 15px}
.hint{font-size:12px;color:var(--gray);margin-bottom:10px;line-height:1.6}
.hint b{color:var(--primary)}
textarea{width:100%;height:72px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;resize:none;outline:none;transition:border .3s;font-family:inherit}
textarea:focus{border-color:var(--primary)}
.btn-primary{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;transition:background .2s}
.btn-primary:active{background:var(--primary-dark);transform:scale(.98)}
.quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.qtag{display:inline-block;padding:5px 12px;background:#f0f4f8;border:1px solid #e0e6ed;border-radius:16px;font-size:12px;color:#555;cursor:pointer;transition:all .15s}
.qtag:active{background:#e8f0fe;color:var(--primary);border-color:var(--primary);transform:scale(.95)}
.preview-box{margin-top:12px;padding:12px;background:#f0f4ff;border:1.5px solid #d6e4ff;border-radius:12px;display:none}
.preview-box.on{display:block}
.preview-title{font-size:13px;color:var(--primary);font-weight:600;margin-bottom:8px}
.preview-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e0e8ff;font-size:13px}
.preview-item:last-child{border:none}
.preview-item .pi-icon{font-size:18px;width:28px;text-align:center}
.preview-item .pi-info{flex:1}
.preview-item .pi-amt{font-weight:700}
.pi-del{font-size:14px;cursor:pointer;padding:2px 6px;opacity:.4;color:var(--danger)}
.pi-del:active{opacity:1}
.preview-actions{display:flex;gap:8px;margin-top:12px}
.preview-actions button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-edit-all{background:#fff;border:1.5px solid var(--primary)!important;color:var(--primary)}
.btn-save-all{background:var(--primary);color:#fff}
.filter-bar{display:flex;gap:6px;padding:0 15px 10px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-bar button{flex-shrink:0;padding:6px 14px;border-radius:16px;border:1.5px solid #d5d8dc;background:#fff;font-size:13px;cursor:pointer;color:#666}
.filter-bar button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.record-list{list-style:none;padding:0 15px}
.record-item{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.record-info{flex:1;cursor:pointer;min-width:0}
.record-desc{font-size:15px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-time{font-size:12px;color:var(--gray)}
.record-amount{font-size:17px;font-weight:700;margin-right:6px;white-space:nowrap}
.amount-income{color:var(--success)}
.amount-expense{color:var(--danger)}
.amount-save{color:var(--save-color)}
.record-actions{display:flex;gap:2px}
.act-btn{width:32px;height:32px;border:none;background:transparent;font-size:15px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.act-btn:active{background:#f0f0f5;transform:scale(.85)}
.search-wrap{position:relative;padding:0 15px 10px}
.search-input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid #e0e6ed;border-radius:10px;font-size:14px;outline:none;background:#fff}
.search-icon{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:14px;color:#bbb}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:100;max-width:600px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--gray);font-size:11px
