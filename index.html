<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>智能记账本</title>
<style>
/* ... 样式部分保持不变，和之前一样 ... */
/* 为了节省篇幅，这里省略样式，实际使用时请保留完整样式 */
</style>
</head>
<body>
<!-- HTML 结构保持不变 -->
<script>
// ===== 数据 =====
var records = JSON.parse(localStorage.getItem('smart_records') || '[]');
var budget = JSON.parse(localStorage.getItem('budget_cfg') || '{"daily":0,"month":0}');
var saveGoal = JSON.parse(localStorage.getItem('save_goal') || '{"target":0,"saved":0}');
var filter = 'all';
var searchQ = '';
var pending = [];
var editingId = null;
var editingIdx = -1;
var mType = 'expense';
var mCat = '';
var alerted = JSON.parse(localStorage.getItem('alerted') || '{}');

// ===== 唯一 ID 生成器（修复核心）=====
var _idCounter = 0;
function genId() {
  _idCounter++;
  return Date.now().toString(36) + '_' + _idCounter + '_' + Math.random().toString(36).substr(2, 6);
}

// ===== 删除记录（确保只删一条）=====
function doDelete(id) {
  // 找到要删除的记录
  var rec = records.find(function(x) { return x.id === id; });
  if (!rec) { toast('❌ 记录不存在'); return; }
  
  // 调整攒钱金额
  if (rec.type === 'save') {
    saveGoal.saved = Math.max(0, saveGoal.saved - rec.amount);
  } else if (rec.type === 'expense') {
    saveGoal.saved += rec.amount;
  }
  
  // 精确删除指定 ID 的记录（只删一条）
  var index = records.findIndex(function(x) { return x.id === id; });
  if (index !== -1) {
    records.splice(index, 1);
  }
  
  save();
  closeConfirm();
  render();
  checkSaveGoal();
  toast('🗑️ 已删除 1 条记录');
}

// ===== 创建新记录时使用 genId() =====
function saveNew() {
  var a = parseFloat(document.getElementById('mAmt').value);
  var note = document.getElementById('mNote').value.trim();
  if (!a || a <= 0) { toast('⚠️ 请输入有效金额'); return; }
  if (!mCat) { toast('⚠️ 请选择分类'); return; }
  var co = CATS[mType].find(function(c) { return c.n === mCat; }) || CATS[mType][CATS[mType].length - 1];
  var now = new Date();
  records.unshift({
    id: genId(),  // ← 使用唯一 ID
    desc: note || (mType === 'income' ? '收入' : mType === 'save' ? '攒钱' : '支出'),
    amount: a,
    type: mType,
    cat: mCat,
    catEmo: co.o,
    time: now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}),
    date: now.toDateString()
  });
  if (mType === 'save') saveGoal.saved += a;
  if (mType === 'expense') saveGoal.saved = Math.max(0, saveGoal.saved - a);
  save();
  closeEditModal();
  render();
  checkBudgetAfterSave();
  checkSaveGoal();
  toast('✅ 已保存 ' + co.o + ' ¥' + a.toFixed(2));
}

// ===== 批量保存时也使用 genId() =====
function saveAllPending() {
  if (!pending.length) return;
  var count = pending.length;
  pending.forEach(function(r) {
    var now = new Date();
    records.unshift({
      id: genId(),  // ← 使用唯一 ID
      desc: r.note,
      amount: r.amount,
      type: r.type,
      cat: r.cat,
      catEmo: r.catEmo,
      time: now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}),
      date: now.toDateString()
    });
    if (r.type === 'save') saveGoal.saved += r.amount;
    else if (r.type === 'expense') saveGoal.saved = Math.max(0, saveGoal.saved - r.amount);
  });
  save();
  pending = [];
  document.getElementById('previewBox').classList.remove('on');
  document.getElementById('voice-input').value = '';
  render();
  checkBudgetAfterSave();
  checkSaveGoal();
  toast('✅ 已保存 ' + count + ' 条记录');
}

// ===== 编辑保存时也保持 ID 不变 =====
function saveEditSingle() {
  var rec = records.find(function(x) { return x.id === editingId; });
  if (!rec) { closeEditModal(); return; }
  var a = parseFloat(document.getElementById('mAmt').value);
  var note = document.getElementById('mNote').value.trim();
  if (!a || a <= 0) { toast('⚠️ 请输入有效金额'); return; }
  if (!mCat) { toast('⚠️ 请选择分类'); return; }
  var co = CATS[mType].find(function(c) { return c.n === mCat; }) || CATS[mType][CATS[mType].length - 1];
  
  // 调整攒钱
  if (rec.type === 'save') saveGoal.saved = Math.max(0, saveGoal.saved - rec.amount);
  if (rec.type === 'expense') saveGoal.saved = Math.max(0, saveGoal.saved + rec.amount);
  if (mType === 'save') saveGoal.saved += a;
  if (mType === 'expense') saveGoal.saved = Math.max(0, saveGoal.saved - a);
  
  rec.type = mType;
  rec.amount = a;
  rec.cat = mCat;
  rec.desc = note || (mType === 'income' ? '收入' : mType === 'save' ? '攒钱' : '支出');
  rec.catEmo = co.o;
  // ID 保持不变
  save();
  editingId = null;
  closeEditModal();
  render();
  checkSaveGoal();
  toast('✅ 已更新');
}

// ... 其余代码保持不变 ...
</script>
</body>
</html>
